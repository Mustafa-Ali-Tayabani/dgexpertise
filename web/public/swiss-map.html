<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#1A1A1A;font-family:Inter,sans-serif;overflow:hidden}
svg{width:100%;height:100%;display:block}
.pin{cursor:pointer}
.pin .ring{r:12;opacity:.3;transition:r .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
.pin.head .ring{r:18}
.pin .lbl{fill:#fff;font-size:13px;font-weight:500;opacity:.9;transition:opacity .25s}
.pin .sub{fill:rgba(255,255,255,.6);font-size:11px;opacity:0;transition:opacity .25s}
.pin:hover .lbl,.pin.active .lbl{opacity:1;font-weight:600}
.pin:hover .sub,.pin.active .sub{opacity:1}
.pin:hover .ring,.pin.active .ring{r:22;opacity:.45}
@keyframes pulse{0%{r:8;opacity:.6}100%{r:34;opacity:0}}
.pulse{animation:pulse 2.4s ease-out infinite}
@keyframes grow{from{r:0}}
@keyframes fade{from{opacity:0}}
#haloOuter,#haloIn,#haloRing{transition:cx .9s cubic-bezier(.4,0,.2,1),cy .9s cubic-bezier(.4,0,.2,1),r .9s cubic-bezier(.4,0,.2,1)}
#guide{transition:x1 .9s cubic-bezier(.4,0,.2,1),y1 .9s cubic-bezier(.4,0,.2,1),y2 .9s cubic-bezier(.4,0,.2,1)}
.legend{position:absolute;right:24px;top:20px;display:flex;gap:20px;font-size:12px;color:rgba(255,255,255,.7);pointer-events:none}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;background:#A6CE00;display:inline-block}
.legend i.halo{background:rgba(166,206,0,.35)}
</style></head><body>
<svg id="map" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet">
  <defs><clipPath id="chclip"><path id="clipPath" /></clipPath></defs>
  <path id="ch" fill="#3a3a3a" stroke="rgba(255,255,255,.18)" stroke-width="1" />
  <circle id="haloOuter" fill="#A6CE00" opacity=".14" style="animation:grow 1.2s cubic-bezier(.2,.8,.2,1)" />
  <circle id="haloIn" fill="#A6CE00" opacity=".5" clip-path="url(#chclip)" style="animation:grow 1.2s cubic-bezier(.2,.8,.2,1)" />
  <circle id="haloRing" fill="none" stroke="#A6CE00" stroke-opacity=".5" stroke-dasharray="3 5" style="animation:fade .6s .9s backwards" />
  <line id="guide" stroke="rgba(255,255,255,.5)" stroke-width="1" x2="1000" />
  <g id="pins"></g>
</svg>
<div class="legend"><span><i></i><b id="lgOffice" style="font-weight:400">Agence</b></span><span><i class="halo"></i><b id="lgArea" style="font-weight:400">Zone d'intervention</b></span></div>

const offices=[
 {id:"geneva",x:324.6,y:411.5,head:true},
 {id:"vaud",x:395.6,y:292.5},
 {id:"neuchatel",x:437,y:248.3},
 {id:"fribourg",x:469.8,y:286.7}
];
const L={
 en:{head:"Head Office",reg:"Regional office",office:"Office",area:"Area of operations",city:{geneva:"Geneva",vaud:"Vaud",neuchatel:"Neuchâtel",fribourg:"Fribourg"}},
 fr:{head:"Siège",reg:"Agence régionale",office:"Agence",area:"Zone d'intervention",city:{geneva:"Genève",vaud:"Vaud",neuchatel:"Neuchâtel",fribourg:"Fribourg"}}
};
let lang="fr", active="geneva";
const R=201.6, rOf=o=>o.head?R:R*0.55;
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
$("ch").setAttribute("d",CH);
$("clipPath").setAttribute("d",CH);
const g=$("pins");
offices.forEach((o,i)=>{
  const p=el("g",{class:"pin"+(o.head?" head":"")+(o.head?" active":""),transform:`translate(${o.x},${o.y})`,style:`animation:fade .5s ${0.9+i*0.12}s backwards`});
  p.appendChild(el("circle",{class:"ring",fill:"#A6CE00"}));
  if(o.head)p.appendChild(el("circle",{class:"pulse",fill:"none",stroke:"#A6CE00","stroke-width":1.5}));
  p.appendChild(el("circle",{r:o.head?6:4.5,fill:"#A6CE00"}));
  if(o.head)p.appendChild(el("circle",{r:2.5,fill:"#1A1A1A"}));
  p.appendChild(el("circle",{r:26,fill:"transparent"}));
  const x=o.head?-20:16, anchor=o.head?"end":"start";
  const lbl=el("text",{class:"lbl",x,y:-6,"text-anchor":anchor});
  const sub=el("text",{class:"sub",x,y:10,"text-anchor":anchor});
  p.appendChild(lbl);p.appendChild(sub);
  p.addEventListener("click",()=>{select(o.id);parent.postMessage({type:"office",id:o.id},"*");});
  o.node=p;o.lbl=lbl;o.sub=sub;
  g.appendChild(p);
});
function moveHalo(o){const r=rOf(o);
  [["haloOuter",r],["haloIn",r],["haloRing",r]].forEach(([id,rr])=>{const c=$(id);c.setAttribute("cx",o.x);c.setAttribute("cy",o.y);c.setAttribute("r",rr);});
  const gl=$("guide");gl.setAttribute("x1",o.x);gl.setAttribute("y1",o.y);gl.setAttribute("y2",o.y);}
function select(id){active=id;const o=offices.find(v=>v.id===id);if(!o)return;
  offices.forEach(v=>v.node.classList.toggle("active",v.id===id));moveHalo(o);}
function applyLang(){const l=L[lang];
  $("lgOffice").textContent=l.office;$("lgArea").textContent=l.area;
  offices.forEach(o=>{o.lbl.textContent=o.head?l.head:l.city[o.id];o.sub.textContent=o.head?l.city[o.id]:l.reg;});}
moveHalo(offices[0]);applyLang();
window.addEventListener("message",e=>{
  if(e.data&&e.data.type==="lang"){lang=e.data.lang==="en"?"en":"fr";applyLang();}
  if(e.data&&e.data.type==="select")select(e.data.id);
});
